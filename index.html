<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple Asset Tracker</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body { font-family: Arial, sans-serif; padding: 16px; background: #f0f2f5; color: #333; }
    h1 { text-align: center; margin-bottom: 16px; }
    .table-container { overflow-x: auto; margin-bottom: 24px; }
    table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    th, td { padding: 12px; text-align: center; border-bottom: 1px solid #ddd; }
    th { background-color: #fafafa; font-weight: bold; }
    .positive { color: green; font-weight: bold; }
    .negative { color: red; font-weight: bold; }
    canvas { max-width: 100%; height: 300px; margin-top: 24px; }
    @media (max-width: 600px) {
      body { padding: 8px; }
      th, td { padding: 8px; font-size: 14px; }
    }
  </style>
</head>
<body>

<h1>Asset Portfolio</h1>
<div class="table-container">
  <table>
    <thead>
      <tr>
        <th>Asset</th>
        <th>Invested ($)</th>
        <th>Current Value ($)</th>
        <th>Current Price ($)</th>
        <th>P / L ($)</th>
      </tr>
    </thead>
    <tbody>
      <tr><td>BTC</td><td id="btc-invested">210</td><td id="btc-value">192.59</td><td id="btc-price">–</td><td id="btc-pl">–</td></tr>
      <tr><td>ETH</td><td id="eth-invested">60</td><td id="eth-value">48.02</td><td id="eth-price">–</td><td id="eth-pl">–</td></tr>
      <tr><td>SPY</td><td id="spy-invested">99</td><td id="spy-value">101.2</td><td id="spy-price">686.19</td><td id="spy-pl">$2.2</td></tr>
      <tr><td>NASDAQ</td><td id="nasdaq-invested">98</td><td id="nasdaq-value">98.3</td><td id="nasdaq-price">605.75</td><td id="nasdaq-pl">$0.3</td></tr>
      <tr><td>VTI</td><td id="VTI-invested">98</td><td id="VTI-value">102.58</td><td id="VTI-price">336.31</td><td id="VTI-pl">-$4.58</td></tr>
      <tr><td><strong>Total</strong></td><td id="total-invested">–</td><td id="total-value">–</td><td>–</td><td id="total-pl">–</td></tr>
    </tbody>
  </table>
</div>

<canvas id="portfolioChart"></canvas>

<script>
  const invested = { btc: 140, eth: 40, spy: 66, nasdaq: 67, VTI: 67 };
  const currentValue = { btc: 161.3, eth: 43, spy: 65.58, nasdaq: 65, VTI: 66.58 };
  const equityPrice = { spy: 683.17, nasdaq: 613.12, VTI: 336.31 };

  async function updateCrypto() {
    try {
      const res = await fetch('https://api.coingecko.com/api/v3/simple/price?ids=bitcoin,ethereum&vs_currencies=usd');
      const data = await res.json();

      const btcPrice = data.bitcoin.usd;
      document.getElementById('btc-price').textContent = btcPrice.toFixed(2);
      document.getElementById('btc-pl').textContent = `$${(currentValue.btc - invested.btc).toFixed(2)}`;
      document.getElementById('btc-pl').className = (currentValue.btc - invested.btc) >= 0 ? 'positive' : 'negative';

      const ethPrice = data.ethereum.usd;
      document.getElementById('eth-price').textContent = ethPrice.toFixed(2);
      document.getElementById('eth-pl').textContent = `$${(currentValue.eth - invested.eth).toFixed(2)}`;
      document.getElementById('eth-pl').className = (currentValue.eth - invested.eth) >= 0 ? 'positive' : 'negative';

      ['spy','nasdaq','VTI'].forEach(asset => {
        document.getElementById(`${asset}-price`).textContent = equityPrice[asset].toFixed(2);
        document.getElementById(`${asset}-pl`).textContent = `$${(currentValue[asset] - invested[asset]).toFixed(2)}`;
        document.getElementById(`${asset}-pl`).className = (currentValue[asset] - invested[asset]) >= 0 ? 'positive' : 'negative';
      });

      // Update totals
      const totalInvested = Object.values(invested).reduce((a,b) => a+b, 0);
      const totalValue = Object.values(currentValue).reduce((a,b) => a+b, 0);
      document.getElementById('total-invested').textContent = `$${totalInvested.toFixed(2)}`;
      document.getElementById('total-value').textContent = `$${totalValue.toFixed(2)}`;
      const totalPL = totalValue - totalInvested;
      document.getElementById('total-pl').textContent = `$${totalPL.toFixed(2)}`;
      document.getElementById('total-pl').className = totalPL >= 0 ? 'positive' : 'negative';

    } catch(err) {
      console.error('Failed to fetch crypto prices', err);
    }
  }

  updateCrypto();

  // Horizontal bar chart including total
  const ctx = document.getElementById('portfolioChart').getContext('2d');
  const labels = ['BTC','ETH','SPY','NASDAQ','VTI','Total'];
  const investedData = [...Object.values(invested), Object.values(invested).reduce((a,b)=>a+b,0)];
  const currentData = [...Object.values(currentValue), Object.values(currentValue).reduce((a,b)=>a+b,0)];

  new Chart(ctx, {
    type: 'bar',
    data: {
      labels: labels,
      datasets: [
        { label: 'Invested ($)', data: investedData, backgroundColor: 'rgba(255, 99, 132, 0.7)' },
        { label: 'Current Value ($)', data: currentData, backgroundColor: 'rgba(54, 162, 235, 0.7)' }
      ]
    },
    options: {
      indexAxis: 'y',
      responsive: true,
      plugins: { legend: { position: 'top' } },
      scales: { x: { beginAtZero: true } }
    }
  });
</script>

</body>
</html>
